[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-filesystem-snapshot-diff"
version = "0.1.0"
description = "Captures lightweight SHA-256 filesystem snapshots before agent runs to audit, diff, or verify allowed file mutations"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-filesystem-snapshot-diff = "agent_filesystem_snapshot_diff.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_filesystem_snapshot_diff*"]
